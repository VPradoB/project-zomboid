services:
  zomboid:
    image: etheth888/project-zomboid-arm64:main
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 2m
    stdin_open: true
    tty: true
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    environment:
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      SERVER_ID: ${SERVER_ID:-servertest}
    volumes:
      - zomboid-data:/home/steam/Zomboid
    command:
      - -ec
      - |
        FEX /home/steam/Steam/steamcmd.sh +force_install_dir /home/steam/Zomboid +login anonymous +app_update 380870 validate +quit
        sed -i 's/"-XX:+UseZGC"/"-XX:+UseG1GC"/' ProjectZomboid64.json
        exec FEX ./start-server.sh -servername "$${SERVER_ID}" -adminpassword "$${ADMIN_PASSWORD}"

volumes:
  zomboid-data:
