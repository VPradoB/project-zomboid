services:
  service-wsmiqakx3ciim6l8mo2ihfrb:
    image: teriyakigod/steamcmd:arm64
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "16261-16269:16261-16269/udp"
      - "27015:27015/tcp"
    environment:
      CPU_MHZ: ${CPU_MHZ:-2000}
      SERVER_NAME: ${SERVER_NAME:-Project Zomboid Dedicated Server}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before running docker compose.}
    volumes:
      - zomboid-install:/home/steam/Steam/ProjectZomboid
      - zomboid-data:/home/steam/Zomboid
    configs:
      - source: adjust-project-zomboid-json.py
        target: /usr/local/bin/adjust-project-zomboid-json.py
    working_dir: /home/steam/Steam
    entrypoint:
      - /bin/sh
      - -ec
      - 'FEXBash ./steamcmd.sh +force_install_dir /home/steam/Steam/ProjectZomboid +login anonymous +app_update 380870 validate +quit && python3 /usr/local/bin/adjust-project-zomboid-json.py /home/steam/Steam/ProjectZomboid/ProjectZomboid64.json && exec FEXBash /home/steam/Steam/ProjectZomboid/start-server.sh -servername "$$SERVER_NAME" -adminpassword "$$ADMIN_PASSWORD"'

configs:
  adjust-project-zomboid-json.py:
    file: ./adjust-project-zomboid-json.py

volumes:
  zomboid-install:
  zomboid-data:
